# 模式库：通用断口模式（产品中立），夹具只是各模式在不同领域的实例。
# 双域验证规则：一个模式至少在两个不相关领域夹具上命中，才能进入 proven-on-multi-domains。
patterns:
- pattern_id: documented_rule_no_consumer
  statement: 已接受的 MUST/MUST_NOT 规则在生产与测试路径均无声明消费者
  detection: rule.consumer_markers × code_scan.identifiers（全项目）
  fixtures:
  - jobflow-preview/PUSH-001
  - shop-checkout/REFUND-002
  - ci-deploy/DEPLOY-001
  domains: [job-search, e-commerce, ci-deploy]
  status: proven-on-3-domains

- pattern_id: test_helper_only
  statement: 消费者标记仅存在于测试路径（测试 helper 自造了生产不存在的前置）
  detection: rule.consumer_markers × code_scan.identifiers（仅测试路径命中）
  fixtures:
  - ci-deploy/DEPLOY-002
  - shop-checkout/REFUND-008
  domains: [ci-deploy, e-commerce]
  status: proven-on-2-domains

- pattern_id: documented_rule_untested
  statement: 生产消费者已接线，但测试路径无回归证据
  detection: rule.consumer_markers × code_scan.identifiers（生产命中、测试未命中）
  fixtures:
  - shop-checkout/REFUND-004
  - ci-deploy/DEPLOY-006
  domains: [e-commerce, ci-deploy]
  status: proven-on-2-domains

- pattern_id: legacy_entry_alive
  statement: 受控入口已接线，但声明为 legacy 的旧入口符号仍在生产路径存活（可绕过）
  detection: rule.legacy_markers × code_scan.identifiers（非测试路径命中）
  fixtures:
  - jobflow-preview/PUSH-002
  - ci-deploy/RELEASE-001
  domains: [job-search, ci-deploy]
  status: proven-on-2-domains

- pattern_id: write_only_state
  statement: 状态标记仅出现在单一生产文件，无其他消费者读取迹象（只写不读的代理）
  detection: rule.state_markers × code_scan.identifiers（单生产文件且无测试）
  fixtures:
  - shop-checkout/REFUND-005
  - jobflow-preview/PUSH-003
  domains: [e-commerce, job-search]
  status: proven-on-2-domains
  severity: info
  note: grep 级代理——单文件出现不排除同文件内读写；语义成熟后升级 severity 并接入 verdict

- pattern_id: state_in_parallel_files
  statement: 同一状态标记并行出现在多个生产文件，双处维护真源不明
  detection: rule.state_markers × code_scan.identifiers（≥2 生产文件）
  fixtures:
  - shop-checkout/REFUND-006
  - ci-deploy/DEPLOY-003
  domains: [e-commerce, ci-deploy]
  status: proven-on-2-domains
  severity: gap

- pattern_id: state_marker_absent
  statement: 声明的状态标记在代码中完全不存在
  detection: rule.state_markers × code_scan.identifiers（零命中）
  fixtures:
  - shop-checkout/REFUND-007
  - ci-deploy/DEPLOY-007
  domains: [e-commerce, ci-deploy]
  status: proven-on-2-domains
  severity: info

- pattern_id: comment_only_reference
  statement: 消费者标记只出现于注释/字符串，不构成真实代码引用（结构化扫描证明）
  detection: code_scan 命中 × ast_scan/js_scan 未命中（.py / .ts/.js）
  fixtures:
  - shop-checkout/REFUND-002
  - ci-deploy/DEPLOY-004
  - web-gate/GATE-002
  - ci-deploy/DEPLOY-005
  domains: [e-commerce, ci-deploy, web-api]
  status: proven-on-multi-domains
  severity: gap
  note: 首夜真实教训的模式化；JS/TS 由 js_scan 词法剥离移植同一思路（无新依赖）

- pattern_id: consumer_markers_undefined
  statement: 已接受的硬规则未声明什么算消费者，无法判定吸收
  detection: rule.consumer_markers 为空
  fixtures:
  - shop-checkout/REFUND-003
  - jobflow-preview/PUSH-004
  domains: [e-commerce, job-search]
  status: proven-on-2-domains
  severity: info
