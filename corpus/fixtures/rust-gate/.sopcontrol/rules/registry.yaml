rules:
- rule_id: RS-001
  statement: 对外写操作必须经 admit_request 受控入口
  modality: MUST
  status: accepted
  scope: rust.write
  owner: platform
  risk: high
  source:
    type: document
    ref: docs/sop.md
  consumer_markers:
  - admit_request
- rule_id: RS-002
  statement: 审计钩子必须经 register_audit_hook 注册
  modality: MUST
  status: accepted
  scope: rust.audit
  owner: platform
  risk: medium
  source:
    type: document
    ref: docs/sop.md
  consumer_markers:
  - register_audit_hook
