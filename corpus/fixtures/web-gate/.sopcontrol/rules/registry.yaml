rules:
- rule_id: GATE-001
  statement: 对外写操作必须经 request_gate 受控入口
  modality: MUST
  status: accepted
  scope: web.write
  owner: platform
  risk: high
  source:
    type: document
    ref: docs/sop.md
  consumer_markers:
  - request_gate
- rule_id: GATE-002
  statement: 审计钩子必须经 audit_hook 注册，注释提及不算接线
  modality: MUST
  status: accepted
  scope: web.audit
  owner: platform
  risk: medium
  source:
    type: document
    ref: docs/sop.md
  consumer_markers:
  - audit_hook
