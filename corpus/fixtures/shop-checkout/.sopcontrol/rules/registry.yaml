rules:
- rule_id: REFUND-001
  statement: 退款必须先调用 confirm_refund 获得用户确认
  modality: MUST
  status: accepted
  scope: checkout.refund
  owner: product
  risk: high
  source:
    type: document
    ref: docs/sop.md
  consumer_markers:
  - confirm_refund
- rule_id: REFUND-002
  statement: 大额退款必须携带 risk_review 审核结果
  modality: MUST
  status: accepted
  scope: checkout.refund
  owner: product
  risk: high
  source:
    type: document
    ref: docs/sop.md
  consumer_markers:
  - risk_review
- rule_id: REFUND-003
  statement: 退款异常必须当日上报值班负责人
  modality: MUST
  status: accepted
  scope: checkout.refund
  owner: product
  risk: medium
  source:
    type: document
    ref: docs/sop.md
- rule_id: REFUND-004
  statement: 退款流水必须写入 audit_log
  modality: MUST
  status: accepted
  scope: checkout.refund
  owner: product
  risk: medium
  source:
    type: document
    ref: docs/sop.md
  consumer_markers:
  - audit_log
- rule_id: REFUND-005
  statement: 退款状态必须以唯一状态源维护
  modality: MUST
  status: accepted
  scope: checkout.state
  owner: product
  risk: medium
  source:
    type: document
    ref: docs/sop.md
  state_markers:
  - refund_state
- rule_id: REFUND-006
  statement: 对账状态必须单一真源，不得双处维护
  modality: MUST
  status: accepted
  scope: checkout.state
  owner: product
  risk: medium
  source:
    type: document
    ref: docs/sop.md
  state_markers:
  - ledger_status
- rule_id: REFUND-007
  statement: 每日摘要必须落盘归档
  modality: MUST
  status: accepted
  scope: checkout.report
  owner: product
  risk: low
  source:
    type: document
    ref: docs/sop.md
  state_markers:
  - daily_digest
- rule_id: REFUND-008
  statement: 退款凭证必须经 receipt_guard 校验
  modality: MUST
  status: accepted
  scope: checkout.refund
  owner: product
  risk: medium
  source:
    type: document
    ref: docs/sop.md
  consumer_markers:
  - receipt_guard
- rule_id: REFUND-009
  statement: 报表 schema_extra_field 必须被下游读取
  modality: MUST
  status: accepted
  scope: checkout.schema
  owner: product
  risk: medium
  source:
    type: document
    ref: docs/sop.md
  state_markers:
  - schema_extra_field
