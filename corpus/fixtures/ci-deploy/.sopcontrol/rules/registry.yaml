rules:
- rule_id: DEPLOY-001
  statement: 部署必须通过 deploy_gate 入口执行
  modality: MUST
  status: accepted
  scope: ci.deploy
  owner: platform
  risk: critical
  source:
    type: document
    ref: docs/runbook.md
  consumer_markers:
  - deploy_gate
- rule_id: ROLLBACK-001
  statement: 回滚必须经过 rollback_guard 校验
  modality: MUST
  status: accepted
  scope: ci.rollback
  owner: platform
  risk: high
  source:
    type: document
    ref: docs/runbook.md
  consumer_markers:
  - rollback_guard
- rule_id: DEPLOY-002
  statement: 发布产物必须携带 release_guard 签名
  modality: MUST
  status: accepted
  scope: ci.release
  owner: platform
  risk: high
  source:
    type: document
    ref: docs/runbook.md
  consumer_markers:
  - release_guard
- rule_id: RELEASE-001
  statement: 产物发布必须经统一管线，遗留直推脚本不得存活
  modality: MUST
  status: accepted
  scope: ci.release
  owner: platform
  risk: critical
  source:
    type: document
    ref: docs/runbook.md
  consumer_markers:
  - publish_pipeline
  legacy_markers:
  - legacy_publish
- rule_id: DEPLOY-003
  statement: 部署状态必须单一真源，不得双处维护
  modality: MUST
  status: accepted
  scope: ci.state
  owner: platform
  risk: medium
  source:
    type: document
    ref: docs/runbook.md
  state_markers:
  - deploy_state
- rule_id: DEPLOY-004
  statement: 部署缓存必须经 cache_gate 预热
  modality: MUST
  status: accepted
  scope: ci.deploy
  owner: platform
  risk: medium
  source:
    type: document
    ref: docs/runbook.md
  consumer_markers:
  - cache_gate
- rule_id: DEPLOY-005
  statement: 部署完成通知必须经 notify_hook 发出
  modality: MUST
  status: accepted
  scope: ci.notify
  owner: platform
  risk: medium
  source:
    type: document
    ref: docs/runbook.md
  consumer_markers:
  - notify_hook
- rule_id: DEPLOY-006
  statement: 部署冒烟必须经 smoke_probe 探针
  modality: MUST
  status: accepted
  scope: ci.smoke
  owner: platform
  risk: medium
  source:
    type: document
    ref: docs/runbook.md
  consumer_markers:
  - smoke_probe
- rule_id: DEPLOY-007
  statement: 金丝雀标志必须单一维护
  modality: MUST
  status: accepted
  scope: ci.state
  owner: platform
  risk: low
  source:
    type: document
    ref: docs/runbook.md
  state_markers:
  - canary_flag
