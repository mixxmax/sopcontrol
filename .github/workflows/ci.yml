name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: sopctl self-test
      - name: strict gate exits 1 on gap fixture
        run: |
          set +e
          sopctl audit corpus/fixtures/jobflow-preview --strict
          code=$?
          set -e
          test "$code" -eq 1
