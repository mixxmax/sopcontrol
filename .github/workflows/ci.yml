name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff blocking checks
        run: ruff check sopcontrol plugins tests
      - name: Tests and combined coverage
        run: pytest -q --cov --cov-report=term-missing
      - run: sopctl self-test
      - name: strict gate exits 1 on gap fixture
        run: |
          set +e
          sopctl audit corpus/fixtures/jobflow-preview --strict
          code=$?
          set -e
          test "$code" -eq 1
