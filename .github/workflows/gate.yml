name: sopcontrol-gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff blocking checks
        run: ruff check sopcontrol plugins tests
      - name: Diff whitespace hygiene
        run: git diff --check
      - name: EVENT_SCHEMA_VERSION aligned
        run: |
          python - <<'PY'
          import sopcontrol
          from sopcontrol.events import SCHEMA_VERSION
          assert sopcontrol.EVENT_SCHEMA_VERSION == SCHEMA_VERSION == "2"
          print("EVENT_SCHEMA_VERSION=2")
          PY
      - name: Activity log trust regressions
        run: pytest -q tests/harness/test_activity_log.py
      - name: Pytest and combined coverage
        run: pytest -q --cov --cov-branch --cov-report=term-missing
      - name: Arm identity and pre-push
        run: |
          sopctl identity init .
          sopctl identity lock .
          sopctl hook install .
      - name: project check
        run: |
          sopctl project all .
          sopctl project check .
      - name: audit compact
        run: sopctl audit . --compact
      - name: doctor --vertical
        run: sopctl doctor . --vertical
      - name: gate on healthy fixture
        run: sopctl gate corpus/fixtures/healthy-billing
      - name: sopctl gate
        run: sopctl gate .
