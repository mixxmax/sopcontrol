name: sopcontrol-gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff blocking checks
        run: ruff check sopcontrol plugins tests
      - name: Pytest and combined coverage
        run: pytest -q --cov --cov-branch --cov-report=term-missing
      - name: Arm identity and pre-push
        run: |
          sopctl identity init .
          sopctl identity lock .
          sopctl hook install .
      - name: audit compact
        run: sopctl audit . --compact
      - name: doctor --vertical
        run: sopctl doctor . --vertical
      - name: sopctl gate
        run: sopctl gate .
