rules:
- rule_id: SELF-001
  statement: 检测模式 write_only_state 必须在生产代码接线并具备回归测试
  modality: MUST
  status: accepted
  scope: project
  owner: user
  risk: medium
  source:
    type: constitution
    ref: ROADMAP.md
    observed_at: null
  consumer_markers:
  - finding_write_only_state
  legacy_markers: []
  state_markers: []
  guard_ids: []
  source_hash: e853c96ba9559ad4
  bypass_note: 可绕过路径：(1) 消费者标记 finding_write_only_state 是标识符代理，把生产代码里的符号改名即可让本规则'看起来'仍满足而实际未接线（R1，待调用图检测收口）；(2)
    把消费者只放在测试路径可被 is_test_path 识破，但测试 helper 转调生产符号仍会被记成生产命中（R2）。可接受的理由：改名同时要改回归测试与语料期望，成本高于收益，且
    audit 会在下一轮把标记从生产路径消失暴露成 documented 缺口。
  attested_by: agent
  attested_at: '2026-08-26T12:36:51.640416Z'
  supersedes: []
  tags: []
  created_at: '2026-08-23T15:52:09.408604Z'
  accepted_at: '2026-08-23T15:52:09.408604Z'
- rule_id: SELF-002
  statement: 检测模式 state_in_parallel_files 必须在生产代码接线并具备回归测试
  modality: MUST
  status: accepted
  scope: project
  owner: user
  risk: medium
  source:
    type: constitution
    ref: ROADMAP.md
    observed_at: null
  consumer_markers:
  - finding_state_in_parallel_files
  legacy_markers: []
  state_markers: []
  guard_ids: []
  source_hash: e853c96ba9559ad4
  bypass_note: 可绕过路径与 SELF-001 同源：finding_state_in_parallel_files 为标识符代理，重命名或把消费者移入测试路径可制造假阳性通过（R1/R2）。此外该模式只看文件级并存状态，同一文件内的双写不在其视野内。可接受的理由：并存状态的跨域语料用例已覆盖两个领域，误报会被零发现用例惩罚；同文件双写留给后续模式而非本条规则。
  attested_by: agent
  attested_at: '2026-08-26T12:36:52.436227Z'
  supersedes: []
  tags: []
  created_at: '2026-08-23T15:52:09.826104Z'
  accepted_at: '2026-08-23T15:52:09.826104Z'
- rule_id: CTRL-001
  statement: 控制器状态目录 .sopcontrol/ 内任何文件不得直接读写或修改，一切写入必须经 sopctl 子命令
  modality: MUST
  status: accepted
  scope: controller.state
  owner: platform
  risk: critical
  source:
    type: document
    ref: docs/ctrl-001.md
    observed_at: null
  consumer_markers:
  - touches_protected_path
  - check_tool_call
  legacy_markers: []
  state_markers: []
  guard_ids:
  - GUARD-CONTROLLER-WRITE
  source_hash: d233165eff321459
  bypass_note: 人工带外编辑不经过拦截层（账本篡改检测兜底）；卸插件=提权被 GUARD-SELF-UNINSTALL 拦；--no-verify 被
    GUARD-NO-VERIFY 拦 + CI 后盾；symlink/大小写逃逸由 R8 三层守卫闭环。详见 docs/ctrl-001.md 绕过分析节
  attested_by: agent
  attested_at: '2026-08-30T08:34:39.263295Z'
  supersedes: []
  tags: []
  created_at: '2026-08-30T08:32:49.216832Z'
  accepted_at: null
